services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dropxcutz}
      POSTGRES_USER: ${POSTGRES_USER:-dropxcutz}
      # Development default only. Override in .env or .env.docker for shared/production use.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropxcutz_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrations:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dropxcutz}:${POSTGRES_PASSWORD:-dropxcutz_dev_password}@postgres:5432/${POSTGRES_DB:-dropxcutz}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Platform Administrator}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-owner@dropxcutz.local}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-DropXcutz2026}
    restart: "no"
    command: ["sh", "-c", "bun run db:deploy && bun run db:seed"]

volumes:
  postgres_data:
